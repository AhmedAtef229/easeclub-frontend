<div
  class="min-h-screen w-screen flex flex-col
         bg-gradient-to-b from-[#D6B8FF] to-primary
         dark:from-[#0F0A1F] dark:to-[#1B1433]"
>

<button
  (click)="toggleTheme()"
  class="fixed bottom-5 right-5 z-50
         w-12 h-12 rounded-full
         bg-white dark:bg-[#0F0B1A]
         shadow-xl flex items-center justify-center
         transition-all duration-300
         hover:scale-110 active:scale-95"
>
  <i
    class="text-xl text-primary dark:text-lavender"
    [ngClass]="themeService.isDarkMode()
      ? 'fa-solid fa-sun'
      : 'fa-solid fa-moon'">
  </i>
</button>
  <button
    (click)="toggleLang()"
    class="fixed bottom-5 left-5 z-50
           px-3 py-2 rounded-lg
           bg-white shadow
           text-sm font-medium"
  >
    {{ translate.currentLang === 'ar' ? 'EN' : 'AR' }}
  </button>


  <main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-[380px]">

      <div class="text-center mb-7 text-white">
        <h1 class="text-5xl font-bold tracking-wide">EaseClub</h1>
        <p class="text-xs tracking-[0.3em] opacity-90 mt-2">
          {{ 'APP.TAGLINE' | translate }}
        </p>
      </div>


      <div
        class="bg-white dark:bg-[#1B1433]
               rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.25)]
               px-6 pt-6 pb-8"
      >

        <div class="flex justify-center mb-4">
          <div
            class="w-12 h-12 rounded-full
                   bg-purple-100 dark:bg-[#0F0B1A]
                   flex items-center justify-center"
          >
            <ng-content select="[icon]"></ng-content>
          </div>
        </div>


        <ng-content></ng-content>
      </div>
    </div>
  </main>


  <footer class="mb-8 text-center text-xs text-white/70">
    <p class="mb-3">
      {{ 'APP.FOOTER.COPYRIGHT' | translate }}
    </p>

    <div class="flex justify-center gap-5">
      <a href="#" class="hover:text-white">
        {{ 'APP.FOOTER.PRIVACY' | translate }}
      </a>
      <a href="#" class="hover:text-white">
        {{ 'APP.FOOTER.SUPPORT' | translate }}
      </a>
      <a href="#" class="hover:text-white">
        {{ 'APP.FOOTER.TERMS' | translate }}
      </a>
    </div>
  </footer>
</div>
