<div
  class="min-h-screen w-screen overflow-hidden flex flex-col bg-gradient-to-b from-lavender to-primary dark:from-[#0F0A1F] dark:to-[#1B1433]"
>
  <!-- Dark Mode Button -->
  <button
    (click)="toggleTheme()"
    class="fixed bottom-4 right-6 z-50 w-11 h-11 rounded-full bg-white dark:bg-darkCard shadow-xl flex items-center justify-center text-gray-700 dark:text-white"
  >
    🌙
  </button>

  <!-- Center -->
  <div class="flex-1 flex flex-col items-center justify-center">
    <!-- Logo -->
    <div class="text-center mb-8 text-white">
      <h1 class="text-4xl font-bold tracking-wide">EaseClub</h1>
      <p class="text-sm tracking-widest opacity-90 mt-1">YOUR CLUB, SIMPLIFIED</p>
    </div>

    <!-- Card -->
    <div class="w-[380px] max-w-[90%] bg-white dark:bg-darkCard rounded-2xl shadow-2xl px-8 py-7">
      <!-- Admin Icon -->
      <div class="flex justify-center mb-4">
        <div
          class="w-14 h-14 rounded-full bg-purple-100 dark:bg-[#2A2150] flex items-center justify-center"
        >
          <svg
            class="w-7 h-7 text-primary dark:text-lavender"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6.75a3.75 3.75 0 11-7.5 0
                 3.75 3.75 0 017.5 0z
                 M4.5 20.25a7.5 7.5 0 0115 0"
            />
          </svg>
        </div>
      </div>

      <!-- SLOT -->
      <ng-content></ng-content>
    </div>
  </div>

  <!-- Footer -->
  <!-- Footer -->
  <footer class="pb-6 text-center text-sm text-white/70">
    <p class="mb-4">© 2024 EaseClub Management Systems. All rights reserved.</p>

    <div class="flex justify-center gap-6 text-white/60">
      <a href="#" class="hover:text-white transition">Privacy Policy</a>
      <a href="#" class="hover:text-white transition">Support</a>
      <a href="#" class="hover:text-white transition">Terms of Service</a>
    </div>
  </footer>
</div>
