  <div class="p-3 sm:p-4 border-t border-gray-200 dark:border-darkBorder flex flex-col gap-2 font-semibold">
    <button

      class="flex items-center gap-3 p-2 sm:p-3 rounded-xl text-sm text-gray-800 dark:text-white hover:bg-gray-100 dark:hover:bg-darkBorder transition-all duration-200 ease-out hover:scale-[1.03]"
