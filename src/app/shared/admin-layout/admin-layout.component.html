<div class="h-screen w-full flex flex-col bg-pageBg dark:bg-darkBg overflow-hidden">

  <app-navbar (menuClick)="toggleSidebar()"></app-navbar>

  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <aside
      class="bg-cardGray dark:bg-darkCard border-r border-gray-200 dark:border-darkBorder
             transition-all duration-300 ease-in-out overflow-hidden
             fixed sm:relative z-40 h-full"
      [class.w-64]="isSidebarOpen"
      [class.w-0]="!isSidebarOpen"
    >
      <app-sidebar [isOpen]="isSidebarOpen"></app-sidebar>
    </aside>

    <!-- Overlay for mobile -->
    <div
      *ngIf="isSidebarOpen"
      class="fixed inset-0 bg-black/30 z-30 sm:hidden"
      (click)="toggleSidebar()"
    ></div>

    <!-- Main -->
    <main class="flex-1 p-4 sm:p-6 overflow-y-auto">
      <router-outlet></router-outlet>
      <app-confirm-dialog></app-confirm-dialog>
    </main>

  </div>

</div>
