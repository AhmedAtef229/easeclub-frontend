<div
  *ngIf="visible"
  class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
>

  <div
    class="bg-white dark:bg-darkCard
           w-full max-w-md
           p-6
           rounded-2xl
           shadow-xl
           border border-gray-200 dark:border-darkBorder"
  >

    <!-- Title -->
    <h2 class="text-lg font-semibold text-darkGray dark:text-white mb-3">
      {{ data?.title || 'Confirm Action' }}
    </h2>

    <!-- Message -->
    <p class="text-sm text-mediumGray mb-6">
      {{ data?.message || 'Are you sure you want to continue?' }}
    </p>

    <!-- Buttons -->
    <div class="flex justify-end gap-3">

      <!-- Cancel -->
      <button
        class="px-4 py-2 rounded-lg
               border border-gray-300 dark:border-darkBorder
               text-darkGray dark:text-white
               hover:bg-gray-100 dark:hover:bg-darkBorder
               transition"
        (click)="onCancel()"
      >
        {{ data?.cancelText || 'Cancel' }}
      </button>

      <!-- Confirm -->
      <button
        class="px-4 py-2 rounded-lg
               bg-red-500 hover:bg-red-600
               text-white
               transition"
        (click)="onConfirm()"
      >
        {{ data?.confirmText || 'Delete' }}
      </button>

    </div>

  </div>

</div>
