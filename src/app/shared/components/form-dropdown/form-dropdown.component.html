<div class="relative" [ngClass]="width">
  <!-- Trigger Button -->
  <button
    type="button"
    [disabled]="disabled"
    (click)="toggle()"
    class="w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-darkCard border border-gray-100 dark:border-darkBorder text-darkGray dark:text-white flex items-center justify-between text-left text-sm font-semibold focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
    [class.opacity-50]="disabled"
    [class.cursor-not-allowed]="disabled"
  >
    <span [ngClass]="selectedValue === null || selectedValue === '' ? 'text-gray-400' : 'text-darkGray dark:text-white'">
      {{ selectedLabel }}
    </span>
    <i class="fa-solid fa-chevron-down text-xs text-mediumGray dark:text-gray-400 transition-transform duration-200" [class.rotate-180]="isOpen"></i>
  </button>

  <!-- Options Menu -->
  <div
    *ngIf="isOpen"
    class="absolute left-0 mt-1 w-full bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder rounded-2xl shadow-xl z-50 overflow-hidden"
  >
    <div class="py-1 max-h-60 overflow-y-auto">
      <div
        *ngFor="let option of parsedOptions"
        (click)="select(option.value)"
        class="px-4 py-2.5 cursor-pointer text-sm flex items-center justify-between text-darkGray dark:text-white hover:bg-gray-50 dark:hover:bg-darkBorder transition-colors duration-150"
      >
        <span class="font-medium">{{ option.label }}</span>
        <!-- Show checkmark icon if selected -->
        <i *ngIf="option.value === selectedValue" class="fa-solid fa-check text-xs text-gray-400 dark:text-gray-300 font-semibold"></i>
      </div>
    </div>
  </div>
</div>
