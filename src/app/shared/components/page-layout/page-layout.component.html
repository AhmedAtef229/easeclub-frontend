<div class="flex flex-col gap-6 sm:gap-8 min-h-full">

  <!-- Title -->
  <div>
    <h1 class="text-2xl sm:text-3xl font-bold text-primary dark:text-darkPrimary">
      {{ title }}
    </h1>

    <p class="text-sm sm:text-base text-mediumGray mt-2">
      {{ subtitle }}
    </p>
  </div>

  <!-- Action Bar -->
  <div
    *ngIf="hasActions"
    class="bg-cardGray dark:bg-darkCard
           border border-gray-200 dark:border-darkBorder
           rounded-2xl p-4 sm:p-5"
  >
    <ng-content select="[actions]"></ng-content>
  </div>

  <!-- Main Content -->
  <div class="flex-1">
    <ng-content></ng-content>
  </div>

</div>
