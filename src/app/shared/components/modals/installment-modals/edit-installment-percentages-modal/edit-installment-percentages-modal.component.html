<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
  <div
    class="bg-white dark:bg-darkCard w-full max-w-xl rounded-2xl shadow-xl border border-gray-200 dark:border-darkBorder animate-in fade-in zoom-in duration-200"
  >
    <!-- Header -->
    <div
      class="flex justify-between items-center p-5 border-b border-gray-200 dark:border-darkBorder"
    >
      <div>
        <h2 class="text-lg font-semibold text-darkGray dark:text-white">
          Edit Installment Percentages
        </h2>
        <p class="text-sm text-mediumGray">Update the percentage distribution</p>
      </div>

      <button
        (click)="close.emit()"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-darkBorder transition-colors flex items-center justify-center text-mediumGray hover:text-darkGray dark:hover:text-white"
      >
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="form" class="p-5 space-y-4">
      <div
        *ngFor="let item of items.controls; let i = index"
        [formGroupName]="i"
        class="p-4 rounded-xl border border-gray-200 dark:border-darkBorder"
      >
        <div class="flex justify-between items-center mb-2">
          <span class="font-medium text-mediumGray"> Installment #{{ i + 1 }} </span>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <!-- Percentage -->
          <div>
            <label class="text-sm font-medium text-darkGray dark:text-white">Percentage *</label>
            <input
              type="number"
              formControlName="percentage"
              class="w-full mt-1 px-3 py-2 rounded-xl bg-lightGray dark:bg-darkBg text-darkGray dark:text-white border border-transparent focus:border-primary outline-none transition-colors"
            />
          </div>

          <!-- Due After -->
          <div>
            <label class="text-sm font-medium text-darkGray dark:text-white">Due After</label>
            <div class="mt-2 text-mediumGray font-semibold">{{ item.value.dueAfterDays }} days</div>
          </div>
        </div>
      </div>

      <!-- Total -->
      <div class="p-3.5 rounded-xl bg-primary/10 text-primary dark:bg-primary/20 dark:text-darkSecondary text-xs font-bold flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i>
        <span>Total: {{ getTotal() }}% / 100%</span>
      </div>
    </form>

    <!-- Footer -->
    <div class="flex justify-end gap-3 p-5 border-t border-gray-200 dark:border-darkBorder">
      <button
        (click)="close.emit()"
        class="px-5 py-2.5 border border-borderGray dark:border-darkBorder rounded-xl font-bold text-xs text-mediumGray hover:text-darkGray dark:hover:text-white hover:bg-gray-50 dark:hover:bg-darkBorder transition-all"
      >
        Cancel
      </button>

      <button
        (click)="submit()"
        class="bg-primary hover:bg-primaryHover text-white px-6 py-2.5 rounded-xl font-bold text-xs shadow-md shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all"
      >
        Save Changes
      </button>
    </div>
  </div>
</div>
