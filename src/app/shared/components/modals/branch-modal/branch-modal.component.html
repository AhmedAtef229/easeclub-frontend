<!-- Overlay -->
<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">

  <!-- Modal -->
  <div
    class="bg-white dark:bg-darkCard
           w-full max-w-md
           rounded-2xl shadow-xl
           border border-gray-200 dark:border-darkBorder
           p-6 space-y-6 animate-in fade-in zoom-in duration-200"
  >

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-darkGray dark:text-white">
          {{ data ? 'Edit Branch' : 'Create Branch' }}
        </h2>

        <p class="text-sm text-mediumGray">
          Add a new branch to your club
        </p>
      </div>

      <button
        (click)="close.emit()"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-darkBorder transition-colors flex items-center justify-center text-mediumGray hover:text-darkGray dark:hover:text-white"
      >
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

      <!-- Branch Name -->
      <div>

        <label class="block text-sm font-medium mb-1 text-darkGray dark:text-white">
          Branch Name <span class="text-danger">*</span>
        </label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter branch name"
          class="w-full px-4 py-2 rounded-xl
                 bg-white dark:bg-darkCard
                 border border-gray-200 dark:border-darkBorder
                 text-darkGray dark:text-white
                 placeholder:text-mediumGray
                 focus:outline-none
                 focus:ring-2 focus:ring-lavender
                 transition"
        />

        <!-- Error -->
        <p
          *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
          class="text-danger text-sm mt-1"
        >
          Branch name is required
        </p>

      </div>

      <!-- Branch Address -->
      <div>

        <label class="block text-sm font-medium mb-1 text-darkGray dark:text-white">
          Branch Address <span class="text-danger">*</span>
        </label>

        <input
          type="text"
          formControlName="address"
          placeholder="Enter branch address"
          class="w-full px-4 py-2 rounded-xl
                 bg-white dark:bg-darkCard
                 border border-gray-200 dark:border-darkBorder
                 text-darkGray dark:text-white
                 placeholder:text-mediumGray
                 focus:outline-none
                 focus:ring-2 focus:ring-lavender
                 transition"
        />

        <!-- Error -->
        <p
          *ngIf="form.get('address')?.touched && form.get('address')?.invalid"
          class="text-danger text-sm mt-1"
        >
          Branch address is required
        </p>

      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4">

        <!-- Cancel -->
        <button
          type="button"
          (click)="close.emit()"
          class="px-5 py-2.5 rounded-xl
                 border border-gray-300 dark:border-darkBorder
                 text-darkGray dark:text-white
                 hover:bg-gray-50 dark:hover:bg-darkBorder hover:text-darkGray
                 transition-all"
        >
          Cancel
        </button>

        <!-- Submit -->
        <button
          type="submit"
          class="px-6 py-2.5 rounded-xl
                 bg-primary hover:bg-primaryHover
                 text-white font-semibold
                 transition-all"
        >
          {{ data ? 'Update' : 'Create' }}
        </button>

      </div>

    </form>

  </div>
</div>
