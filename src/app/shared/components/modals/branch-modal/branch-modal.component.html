
<!-- Overlay -->
<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

  <!-- Modal -->
  <div
    class="bg-white dark:bg-darkCard
           w-full max-w-md rounded-2xl shadow-xl
           p-6 space-y-6"
  >

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-darkGray dark:text-white">
          {{ data ? 'Edit Branch' : 'Create Branch' }}
        </h2>
        <p class="text-sm text-gray-500">
          Add a new branch to your club
        </p>
      </div>

      <button
        (click)="close.emit()"
        class="text-gray-400 hover:text-gray-600 text-xl"
      >
        ✕
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

      <!-- Branch Name -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Branch Name <span class="text-red-500">*</span>
        </label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter branch name"
          class="w-full px-4 py-2 rounded-xl
                 border border-gray-300
                 focus:outline-none focus:ring-2 focus:ring-primary"
        />

        <!-- Error -->
        <p
          *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
          class="text-sm text-red-500 mt-1"
        >
          Branch name is required
        </p>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4">
        <button
          type="button"
          (click)="close.emit()"
          class="px-5 py-2 rounded-xl
                 border border-gray-300
                 hover:bg-gray-100"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="px-6 py-2 rounded-xl
                 bg-primary text-white
                 hover:opacity-90"
        >
          {{ data ? 'Update' : 'Create' }}
        </button>
      </div>

    </form>

  </div>
</div>
