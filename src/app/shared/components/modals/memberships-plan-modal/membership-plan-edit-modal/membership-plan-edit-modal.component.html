<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white dark:bg-darkCard w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-gray-100 dark:border-darkBorder animate-in fade-in zoom-in duration-200">
    
    <!-- 🟢 Header -->
    <div class="p-6 pb-4 flex justify-between items-start">
      <div>
        <h2 class="text-xl font-bold text-darkGray dark:text-white">Edit Membership Plan</h2>
        <p class="text-mediumGray text-sm">Update plan pricing and details</p>
      </div>
      <button (click)="close.emit()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-darkBorder transition-colors">
        <i class="fa-solid fa-xmark text-mediumGray text-lg"></i>
      </button>
    </div>

    <!-- 🟢 Body -->
    <div class="p-6 space-y-6">
      <form [formGroup]="form" class="space-y-4">
        
        <!-- Plan Name -->
        <div>
          <label class="text-sm font-semibold text-darkGray dark:text-white block mb-1.5">Plan Name *</label>
          <input
            formControlName="name"
            placeholder="e.g., Premium Adult Annual"
            class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-darkCard border border-gray-100 dark:border-darkBorder text-darkGray dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
          />
        </div>

        <!-- Description -->
        <div>
          <label class="text-sm font-semibold text-darkGray dark:text-white block mb-1.5">Description</label>
          <textarea
            formControlName="description"
            rows="3"
            placeholder="Brief description of this plan"
            class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-darkCard border border-gray-100 dark:border-darkBorder text-darkGray dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none"
          ></textarea>
        </div>

        <!-- Prices Row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm font-semibold text-darkGray dark:text-white block mb-1.5">Total Price ($) *</label>
            <input
              type="number"
              formControlName="price"
              class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-darkCard border border-gray-100 dark:border-darkBorder text-darkGray dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
            />
          </div>
          <div>
            <label class="text-sm font-semibold text-darkGray dark:text-white block mb-1.5">Renew Price ($) *</label>
            <input
              type="number"
              formControlName="renewPrice"
              class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-darkCard border border-gray-100 dark:border-darkBorder text-darkGray dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
            />
          </div>
        </div>
      </form>
    </div>

    <!-- 🟢 Footer -->
    <div class="p-6 border-t border-gray-100 dark:border-darkBorder flex justify-end gap-3 bg-gray-50/30">
      <button
        (click)="close.emit()"
        class="px-6 py-2.5 font-bold text-mediumGray hover:text-darkGray transition-colors"
      >
        Cancel
      </button>
      <button
        (click)="submit()"
        class="px-8 py-2.5 rounded-xl bg-primary hover:bg-primaryHover text-white font-bold shadow-lg shadow-primary/20 transition-all active:scale-95"
      >
        Save Changes
      </button>
    </div>
  </div>
</div>
