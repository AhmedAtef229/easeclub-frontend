<!-- Overlay -->
<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">

  <!-- Modal -->
  <div
    class="bg-white dark:bg-darkCard
           w-full max-w-lg
           rounded-2xl shadow-xl
           border border-gray-200 dark:border-darkBorder
           p-6 space-y-6 animate-in fade-in zoom-in duration-200"
  >

    <!-- Header -->
    <div class="flex items-start justify-between">
      <div>
        <h2 class="text-xl font-semibold text-darkGray dark:text-white">
          {{ data ? 'Edit Membership Type' : 'Create Membership Type' }}
        </h2>

        <p class="text-sm text-mediumGray">
          Add a new membership type to your club
        </p>
      </div>

      <button
        type="button"
        (click)="close.emit()"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-darkBorder transition-colors flex items-center justify-center"
      >
        <i class="fa-solid fa-xmark text-lg text-mediumGray"></i>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" class="space-y-5" (ngSubmit)="onSave()">

      <!-- Name -->
      <div class="space-y-1">

        <label class="text-sm font-medium text-darkGray dark:text-white">
          Name <span class="text-danger">*</span>
        </label>

        <input
          type="text"
          formControlName="name"
          placeholder="e.g., Adult Membership"
          class="w-full px-4 py-2 rounded-xl
                 bg-white dark:bg-darkCard
                 border border-gray-200 dark:border-darkBorder
                 text-darkGray dark:text-white
                 placeholder:text-mediumGray
                 focus:outline-none
                 focus:ring-2 focus:ring-primary/20 focus:border-primary"
        />

        <p *ngIf="isInvalid('name')" class="text-sm text-danger">
          Name is required
        </p>

      </div>

      <!-- Description -->
      <div class="space-y-1">

        <label class="text-sm font-medium text-darkGray dark:text-white">
          Description
        </label>

        <textarea
          rows="3"
          formControlName="description"
          placeholder="Brief description of this membership type"
          class="w-full px-4 py-2 rounded-xl
                 bg-white dark:bg-darkCard
                 border border-gray-200 dark:border-darkBorder
                 text-darkGray dark:text-white
                 placeholder:text-mediumGray
                  focus:outline-none
                  focus:ring-2 focus:ring-primary/20 focus:border-primary"
        ></textarea>

      </div>

      <!-- Family Membership -->
     

      <!-- Branches -->
      <div
        class="bg-gray-50 dark:bg-darkBorder
               rounded-xl p-4 space-y-3"
      >

        <label class="flex items-center gap-3 text-sm font-medium text-darkGray dark:text-white">
          <input
            type="checkbox"
            formControlName="allBranches"
            class="w-4 h-4 accent-primary"
          />
          All Branches Permitted
        </label>

        <div *ngIf="!form.value.allBranches" class="space-y-2">

          <p class="text-sm font-medium text-darkGray dark:text-white">
            Select Branches <span class="text-danger">*</span>
          </p>

          <div class="max-h-32 overflow-y-auto space-y-2 pr-1">

            <label
              *ngFor="let branch of branches"
              class="flex items-center gap-3 text-sm text-darkGray dark:text-white"
            >
              <input
                type="checkbox"
                class="w-4 h-4 accent-primary"
                [checked]="form.value.selectedBranches.includes(branch.id)"
                (change)="toggleBranch(branch.id)"
              />

              {{ branch.name }}

            </label>

          </div>

          <p *ngIf="isInvalid('selectedBranches')" class="text-sm text-danger">
            Please select at least one branch
          </p>

        </div>

      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4">

        <!-- Cancel -->
        <button
          type="button"
          (click)="close.emit()"
          class="px-5 py-2 rounded-xl
                 border border-gray-300 dark:border-darkBorder
                 text-darkGray dark:text-white
                 hover:bg-gray-100 dark:hover:bg-darkBorder
                 transition"
        >
          Cancel
        </button>

        <!-- Save -->
        <button
          type="submit"
          class="px-6 py-2 rounded-xl
                 bg-primary hover:bg-primaryHover
                 text-white transition"
        >
          {{ data ? 'Update' : 'Create' }}
        </button>

      </div>

    </form>

  </div>
</div>
