<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="flex items-center justify-between p-5 border-b">
      <div>
        <h2 class="text-lg font-semibold">Create Membership Plan</h2>
        <p class="text-sm text-gray-500">Create a new membership plan with installment options</p>
      </div>

      <button (click)="close.emit()" class="text-gray-400 hover:text-black">✕</button>
    </div>

    <!-- Body -->
    <form [formGroup]="form" class="p-5 space-y-5">
      <!-- Plan Name -->
      <div>
        <label class="text-sm font-medium">Plan Name *</label>
        <input
          formControlName="name"
          class="w-full mt-1 px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
          placeholder="e.g. Premium Adult Annual"
        />
        <p
          *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
          class="text-red-500 text-xs mt-1"
        >
          Plan name is required
        </p>
      </div>

      <!-- Description -->
      <div>
        <label class="text-sm font-medium">Description</label>
        <textarea
          formControlName="description"
          class="w-full mt-1 px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
          placeholder="Brief description of this plan"
        ></textarea>
      </div>

      <!-- Membership Type -->
      <div>
        <label class="text-sm font-medium">Membership Type *</label>
        <select
          formControlName="membershipType"
          class="w-full mt-1 px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
        >
          <option value="">Select membership type</option>
          <option value="Premium">Premium</option>
          <option value="Standard">Standard</option>
          <option value="Family">Family</option>
        </select>
      </div>

      <!-- Price & Duration -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium">Total Price ($) *</label>
          <input
            type="number"
            formControlName="price"
            class="w-full mt-1 px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
            placeholder="e.g. 1200"
          />
        </div>

        <div>
          <label class="text-sm font-medium">Duration (days) *</label>
          <input
            type="number"
            formControlName="duration"
            class="w-full mt-1 px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
            placeholder="e.g. 365"
          />
        </div>
      </div>

      <!-- Active -->
      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="active" />
        <span class="text-sm">Plan is Active</span>
      </label>

      <!-- Installment Templates -->
      <div>
        <h3 class="font-medium mb-2">Installment Templates</h3>

        <div class="space-y-2">
          <div
            *ngFor="let t of installmentTemplates"
            class="flex items-center gap-3 p-3 border rounded-xl"
          >
            <input type="checkbox" (change)="toggleTemplate(t.id)" />

            <span class="font-medium">{{ t.name }}</span>

            <span class="ml-auto px-3 py-1 rounded-full bg-purple-100 text-purple-700 text-xs">
              {{ t.installments }} installments
            </span>

            <span
              *ngIf="t.duration"
              class="px-3 py-1 rounded-full bg-gray-100 text-gray-600 text-xs"
            >
              {{ t.duration }}
            </span>
          </div>
        </div>
      </div>
    </form>

    <!-- Footer -->
    <div class="flex justify-end gap-3 p-5 border-t">
      <button (click)="close.emit()">Cancel</button>
      <button (click)="submit()" class="bg-primary text-white px-5 py-2 rounded-xl">
        Create Plan
      </button>
    </div>
  </div>
</div>
