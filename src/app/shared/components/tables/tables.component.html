<div
  class="overflow-x-auto rounded-xl border border-gray-200 dark:border-darkBorder bg-cardGray dark:bg-darkCard"
>
  <table class="w-full text-left border-collapse text-sm sm:text-base">
    <!-- Header -->
    <thead class="bg-gray-50 dark:bg-darkBorder">
      <tr class="text-xs sm:text-sm text-mediumGray">
        <th *ngFor="let col of columns || []" class="p-2 sm:p-3 font-medium whitespace-nowrap">
          {{ col?.label }}
        </th>

        <th *ngIf="showActions" class="p-2 sm:p-3 text-right font-medium whitespace-nowrap">
          Actions
        </th>
      </tr>
    </thead>

    <!-- Body -->
    <tbody>
      <tr
        *ngFor="let row of data || []"
        class="border-t border-gray-200 dark:border-darkBorder text-darkGray dark:text-white hover:bg-gray-50 dark:hover:bg-darkBorder transition"
      >
        <!-- Dynamic Columns -->
        <td *ngFor="let col of columns || []" class="p-2 sm:p-3">
          <!-- STATUS -->
          <ng-container *ngIf="col?.type === 'status'">
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                class="sr-only peer"
                [checked]="row?.[col.key] ?? false"
                (change)="toggleStatus.emit(row)"
              />
              <div
                class="w-10 h-5 sm:w-11 sm:h-6 bg-gray-200 rounded-full peer peer-checked:bg-cyan-400 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-4 after:w-4 sm:after:h-5 sm:after:w-5 after:transition-all peer-checked:after:translate-x-full relative"
              ></div>
            </label>
          </ng-container>

          <!-- Badge -->
          <ng-container *ngIf="col?.type === 'badge'">
            <div class="flex flex-wrap gap-1">
              <span
                *ngFor="let item of row?.[col.key] || []"
                class="px-2 py-1 rounded-full bg-purple-100 text-purple-700 text-xs"
              >
                {{ item }}
              </span>

              <span *ngIf="!row?.[col.key]?.length" class="text-gray-400 text-xs sm:text-sm">
                None
              </span>
            </div>
          </ng-container>

          <!-- Boolean -->
          <ng-container *ngIf="col?.type === 'boolean'">
            <span
              class="px-2 sm:px-3 py-1 rounded-full text-xs sm:text-sm"
              [ngClass]="
                row?.[col.key]
                  ? 'bg-cyan-100 text-cyan-700 dark:bg-darkBorder dark:text-success'
                  : 'bg-gray-200 text-gray-600 dark:bg-darkBorder dark:text-gray-400'
              "
            >
              {{ row?.[col.key] ? 'Yes' : 'No' }}
            </span>
          </ng-container>

          <!-- Text -->
          <ng-container *ngIf="!col?.type || col?.type === 'text'">
            {{ row?.[col.key] ?? '-' }}
          </ng-container>
        </td>

        <!-- Actions -->
        <td *ngIf="showActions" class="p-2 sm:p-3 text-right">
          <div class="flex justify-end gap-1 sm:gap-2">
            <button
              *ngIf="showView"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-gray-200 dark:border-darkBorder text-mediumGray hover:text-primary"
              (click)="view.emit(row)"
            >
              <i class="fa-regular fa-eye text-xs sm:text-sm"></i>
            </button>

            <button
              *ngIf="showCopy"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-gray-200 dark:border-darkBorder text-mediumGray hover:text-primary"
              (click)="copy.emit(row)"
            >
              <i class="fa-regular fa-copy text-xs sm:text-sm"></i>
            </button>

            <button
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-gray-200 dark:border-darkBorder text-mediumGray hover:text-primary"
              (click)="edit.emit(row)"
            >
              <i class="fa-regular fa-pen-to-square text-xs sm:text-sm"></i>
            </button>
            <button
              *ngIf="showManage"
              (click)="manage.emit(row)"
              title="Manage Connections"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-borderGray dark:border-darkBorder text-mediumGray hover:text-primary hover:bg-lavender/20 transition"
            >
              <i class="fa-solid fa-link text-xs sm:text-sm"></i>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
