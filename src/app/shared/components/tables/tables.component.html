<div [ngClass]="borderless ? 'w-full flex flex-col' : 'rounded-2xl border border-gray-200 dark:border-darkBorder bg-cardGray dark:bg-darkCard flex flex-col overflow-hidden'">
  <div class="overflow-x-auto w-full">
    <table class="w-full text-left border-collapse text-sm sm:text-base">
    <!-- Header -->
    <thead class="border-b border-gray-200 dark:border-darkBorder bg-transparent">
      <tr class="text-xs sm:text-sm text-darkGray dark:text-gray-300">
        <th *ngFor="let col of columns || []" class="p-2 sm:p-3 font-semibold whitespace-nowrap">
          {{ col?.label }}
        </th>

        <th *ngIf="showActions" class="p-2 sm:p-3 text-right font-medium whitespace-nowrap">
          Actions
        </th>
      </tr>
    </thead>

    <!-- Body -->
    <tbody>
      <tr
        *ngFor="let row of paginatedData || []"
        class="border-b border-gray-200 dark:border-darkBorder bg-cardGray dark:bg-darkCard text-darkGray dark:text-white hover:bg-gray-200 dark:hover:bg-darkBorder transition"
      >
        <!-- Dynamic Columns -->
        <td *ngFor="let col of columns || []; let first = first" class="p-2 sm:p-3">
          <!-- STATUS -->
          <ng-container *ngIf="col?.type === 'status'">
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                class="sr-only peer"
                [checked]="row?.[col.key] ?? false"
                (change)="toggleStatus.emit(row)"
              />
              <div
                class="w-10 h-5 sm:w-11 sm:h-6 bg-gray-200 dark:bg-darkBorder rounded-full peer peer-checked:bg-cyan-400 dark:peer-checked:bg-darkPrimary after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border dark:after:border-darkBorder after:rounded-full after:h-4 after:w-4 sm:after:h-5 sm:after:w-5 after:transition-all peer-checked:after:translate-x-full relative"
              ></div>
            </label>
          </ng-container>

          <!-- Badge -->
          <ng-container *ngIf="col?.type === 'badge'">
            <div class="flex flex-wrap gap-1">
              <span
                *ngFor="let item of row?.[col.key] || []"
                class="px-2.5 py-1 rounded-full bg-primary/10 text-primary dark:bg-darkPrimary/20 dark:text-darkPrimary text-xs font-semibold"
              >
                {{ item }}
              </span>

              <span *ngIf="!row?.[col.key]?.length" class="text-gray-400 text-xs sm:text-sm">
                None
              </span>
            </div>
          </ng-container>

          <!-- Boolean -->
          <ng-container *ngIf="col?.type === 'boolean'">
            <span
              class="px-2 sm:px-3 py-1 rounded-full text-xs sm:text-sm"
              [ngClass]="
                row?.[col.key]
                  ? 'bg-cyan-100 text-cyan-700 dark:bg-darkBorder dark:text-success'
                  : 'bg-gray-200 text-gray-600 dark:bg-darkBorder dark:text-gray-400'
              "
            >
              {{ row?.[col.key] ? 'Yes' : 'No' }}
            </span>
          </ng-container>

          <!-- Text -->
          <ng-container *ngIf="!col?.type || col?.type === 'text'">
            <span [ngClass]="first ? 'font-semibold text-darkGray dark:text-white' : 'text-mediumGray dark:text-gray-400'">
              {{ row?.[col.key] ?? '-' }}
            </span>
          </ng-container>
        </td>

        <!-- Actions -->
        <td *ngIf="showActions" class="p-2 sm:p-3 text-right">
          <div class="flex justify-end gap-1 sm:gap-2">
            <button
              *ngIf="showView"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-gray-200 dark:border-darkBorder text-mediumGray hover:text-primary"
              (click)="view.emit(row)"
            >
              <i class="fa-regular fa-eye text-xs sm:text-sm"></i>
            </button>

            <button
              *ngIf="showCopy"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-gray-200 dark:border-darkBorder text-mediumGray hover:text-primary"
              (click)="copy.emit(row)"
            >
              <i class="fa-regular fa-copy text-xs sm:text-sm"></i>
            </button>

            <button
              *ngIf="showEdit"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-gray-200 dark:border-darkBorder text-mediumGray hover:text-primary"
              (click)="edit.emit(row)"
            >
              <i class="fa-regular fa-pen-to-square"></i>
            </button>
            <button
              *ngIf="showManage"
              (click)="manage.emit(row)"
              title="Manage Connections"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-md flex items-center justify-center border border-borderGray dark:border-darkBorder text-mediumGray hover:text-primary hover:bg-lavender/20 transition"
            >
              <i class="fa-solid fa-link text-xs sm:text-sm"></i>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  </div>

  <!-- Pagination Footer -->
  <div *ngIf="totalPages > 0" class="px-4 py-3 sm:px-6 flex items-center justify-between border-t border-gray-200 dark:border-darkBorder bg-cardGray dark:bg-darkCard rounded-b-2xl">
    <div class="text-sm text-mediumGray dark:text-gray-400">
      Showing <span class="font-medium text-darkGray dark:text-white">{{ showingStart }}&ndash;{{ showingEnd }}</span> of <span class="font-medium text-darkGray dark:text-white">{{ serverSide ? totalCount : data?.length }}</span> {{ itemLabel }}
    </div>
    <div class="flex items-center gap-1 sm:gap-2">
      <button 
        (click)="goToPage(currentPage - 1)" 
        [disabled]="currentPage === 1" 
        class="w-8 h-8 flex items-center justify-center rounded-md text-mediumGray hover:text-darkGray dark:hover:text-white disabled:opacity-50 disabled:cursor-not-allowed transition"
      >
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>
      
      <button 
        *ngFor="let page of pagesArray" 
        (click)="goToPage(page)"
        class="w-8 h-8 flex items-center justify-center rounded-md text-sm transition"
        [ngClass]="page === currentPage ? 'bg-primary text-white font-medium' : 'text-mediumGray hover:bg-gray-100 dark:hover:bg-darkBorder hover:text-darkGray dark:hover:text-white'"
      >
        {{ page }}
      </button>

      <button 
        (click)="goToPage(currentPage + 1)" 
        [disabled]="currentPage === totalPages" 
        class="w-8 h-8 flex items-center justify-center rounded-md text-mediumGray hover:text-darkGray dark:hover:text-white disabled:opacity-50 disabled:cursor-not-allowed transition"
      >
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>
    </div>
  </div>
</div>
