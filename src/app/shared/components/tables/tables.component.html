<div class="overflow-x-auto rounded-xl border">
  <table class="w-full text-left border-collapse">

    <!-- Header -->
    <thead class="bg-gray-50 dark:bg-darkCard">
      <tr class="text-sm text-gray-500">
        <th *ngFor="let col of columns" class="p-3">
          {{ col.label }}
        </th>

        <th *ngIf="showActions" class="p-3 text-right">
          Actions
        </th>
      </tr>
    </thead>

    <!-- Body -->
    <tbody>
      <tr
        *ngFor="let row of data"
        class="border-t hover:bg-gray-50 dark:hover:bg-darkBorder"
      >

        <!-- Dynamic Columns -->
        <td *ngFor="let col of columns" class="p-3">

          <!-- Badge -->
          <ng-container *ngIf="col.type === 'badge'">
            <span
              class="px-3 py-1 rounded-full bg-purple-100 text-purple-700 text-sm"
            >
              {{ row[col.key] }}
            </span>
          </ng-container>

          <!-- Boolean -->
          <ng-container *ngIf="col.type === 'boolean'">
            <span
              class="px-3 py-1 rounded-full text-sm"
              [ngClass]="row[col.key]
                ? 'bg-cyan-100 text-cyan-700'
                : 'bg-gray-200 text-gray-600'"
            >
              {{ row[col.key] ? 'Yes' : 'No' }}
            </span>
          </ng-container>

          <!-- Text -->
          <ng-container *ngIf="!col.type || col.type === 'text'">
            {{ row[col.key] }}
          </ng-container>

        </td>

        <!-- Actions -->
        <td
          *ngIf="showActions"
          class="p-3 text-right"
        >
          <div class="flex justify-end gap-2">

         <button
  class="w-8 h-8 rounded-md
         flex items-center justify-center
         border border-gray-200
         text-gray-600
         hover:bg-gray-100 hover:text-primary
         transition"
  (click)="edit.emit(row)"
  title="Edit"
>
  <i class="fa-regular fa-pen-to-square text-sm"></i>
</button>

          <button
  class="w-8 h-8 rounded-md
         flex items-center justify-center
         border border-red-200
         text-red-500
         hover:bg-red-50 hover:text-red-600
         transition"
  (click)="remove.emit(row)"
  title="Delete"
>
  <i class="fa-solid fa-trash-can text-sm"></i>
</button>

          </div>
        </td>

      </tr>
    </tbody>

  </table>
</div>
