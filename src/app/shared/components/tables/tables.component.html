<div
  class="overflow-x-auto rounded-xl
         border border-gray-200 dark:border-darkBorder
         bg-white dark:bg-darkCard"
>

  <table class="w-full text-left border-collapse">

    <!-- Header -->
    <thead class="bg-gray-50 dark:bg-darkBorder">

      <tr class="text-sm text-mediumGray">

        <th
          *ngFor="let col of columns"
          class="p-3 font-medium"
        >
          {{ col.label }}
        </th>

        <th
          *ngIf="showActions"
          class="p-3 text-right font-medium"
        >
          Actions
        </th>

      </tr>

    </thead>

    <!-- Body -->
    <tbody>

      <tr
        *ngFor="let row of data"
        class="border-t border-gray-200 dark:border-darkBorder
               text-darkGray dark:text-white
               hover:bg-gray-50 dark:hover:bg-darkBorder
               transition"
      >

        <!-- Dynamic Columns -->
        <td *ngFor="let col of columns" class="p-3">

          <!-- Badge -->
          <ng-container *ngIf="col.type === 'badge'">
            <span
              class="px-3 py-1 rounded-full
                     bg-purple-100 text-purple-700
                     dark:bg-darkBorder dark:text-darkSecondary
                     text-sm"
            >
              {{ row[col.key] }}
            </span>
          </ng-container>

          <!-- Boolean -->
          <ng-container *ngIf="col.type === 'boolean'">
            <span
              class="px-3 py-1 rounded-full text-sm"
              [ngClass]="row[col.key]
                ? 'bg-cyan-100 text-cyan-700 dark:bg-darkBorder dark:text-success'
                : 'bg-gray-200 text-gray-600 dark:bg-darkBorder dark:text-gray-400'"
            >
              {{ row[col.key] ? 'Yes' : 'No' }}
            </span>
          </ng-container>

          <!-- Text -->
          <ng-container *ngIf="!col.type || col.type === 'text'">
            {{ row[col.key] }}
          </ng-container>

        </td>

        <!-- Actions -->
        <td *ngIf="showActions" class="p-3 text-right">

          <div class="flex justify-end gap-2">

            <!-- View -->
            <button
              *ngIf="showView"
              class="w-8 h-8 rounded-md
                     flex items-center justify-center
                     border border-gray-200 dark:border-darkBorder
                     text-mediumGray dark:text-gray-300
                     hover:bg-gray-100 dark:hover:bg-darkBorder
                     hover:text-primary
                     transition"
              (click)="view.emit(row)"
              title="View"
            >
              <i class="fa-regular fa-eye text-sm"></i>
            </button>

            <!-- Copy -->
            <button
              *ngIf="showCopy"
              class="w-8 h-8 rounded-md
                     flex items-center justify-center
                     border border-gray-200 dark:border-darkBorder
                     text-mediumGray dark:text-gray-300
                     hover:bg-gray-100 dark:hover:bg-darkBorder
                     hover:text-primary
                     transition"
              (click)="copy.emit(row)"
              title="Copy"
            >
              <i class="fa-regular fa-copy text-sm"></i>
            </button>

            <!-- Edit -->
            <button
              class="w-8 h-8 rounded-md
                     flex items-center justify-center
                     border border-gray-200 dark:border-darkBorder
                     text-mediumGray dark:text-gray-300
                     hover:bg-gray-100 dark:hover:bg-darkBorder
                     hover:text-primary
                     transition"
              (click)="edit.emit(row)"
              title="Edit"
            >
              <i class="fa-regular fa-pen-to-square text-sm"></i>
            </button>

            <!-- Delete -->
            <button
              class="w-8 h-8 rounded-md
                     flex items-center justify-center
                     border border-red-200 dark:border-red-400
                     text-red-500
                     hover:bg-red-50 dark:hover:bg-red-900/20
                     hover:text-red-600
                     transition"
              (click)="remove.emit(row)"
              title="Delete"
            >
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>

          </div>

        </td>

      </tr>

    </tbody>

  </table>

</div>
