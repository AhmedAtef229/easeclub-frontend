<app-page-layout
  title="Membership Type Management"
  subtitle="Define membership categories for your club"
>

  <!-- ================= Actions ================= -->
  <div actions class="flex items-center justify-between gap-4">

    <!-- Search -->

  <app-search-input
  placeholder="Search templates..."
  (search)="onSearch($event)"
></app-search-input>
    <!-- Create Button -->
    <button
      class="bg-primary text-white
             px-5 py-2 rounded-xl
             flex items-center gap-2 hover:opacity-90"
      (click)="openCreateModal()"
    >
      <span class="text-lg">+</span>
      Create Type
    </button>

  </div>

  <!-- ================= Content ================= -->
  <div class="space-y-4">

    <!-- Header -->
    <div>
      <h2 class="text-xl font-semibold">
        Membership Types
      </h2>

      <p class="text-sm text-gray-500">
        {{ data.length }} types found
      </p>
    </div>

    <!-- Table -->
 <app-tables
  [columns]="columns"
  [data]="filteredData"
  [showActions]="true"
  (edit)="openEditModal($event)"
  (remove)="deleteMembershipType($event)"
>
</app-tables>
  </div>

</app-page-layout>

<!-- ================= Modal ================= -->
<app-membership-type-modal
  *ngIf="isModalOpen"
  [data]="editItem"
  (close)="closeModal()"
  (save)="saveMembershipType($event)"
>
</app-membership-type-modal>
