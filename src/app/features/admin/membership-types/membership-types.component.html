<app-page-layout
  title="Membership Type Management"
  subtitle="Define membership types with branch access permissions"
>
  <!-- Filters -->
  <div actions class="flex items-center justify-between">

    <div class="flex gap-3">

      <!-- ✅ Status Dropdown -->
      <app-dropdown
        class="w-40"
        [options]="['All','Active','Inactive']"
        [selected]="selectedStatus"
        (valueChange)="applyStatusFilter($event)"
      ></app-dropdown>

      <!-- ✅ Branch Dropdown -->
      <app-dropdown
        class="w-44"
        [options]="branchOptions"
        [selected]="selectedBranchLabel"
        (valueChange)="onBranchSelect($event)"
      ></app-dropdown>

    </div>

    <!-- Create -->
    <button
      class="px-5 py-2 rounded-xl bg-primary text-white"
      (click)="openCreateModal()"
    >
      + Create Type
    </button>

  </div>

  <!-- Table -->
  <app-tables
    [columns]="columns"
    [data]="filteredData"
    [showActions]="false"
    (toggleStatus)="toggleStatus($event)"
    (edit)="openEditModal($event)"
  ></app-tables>
</app-page-layout>

<!-- Modal -->
<app-membership-type-modal
  *ngIf="isModalOpen"
  [branches]="branches"
  [data]="editItem"
  (save)="saveMembershipType($event)"
  (close)="closeModal()"
></app-membership-type-modal>
