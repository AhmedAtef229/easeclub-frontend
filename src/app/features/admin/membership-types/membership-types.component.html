<app-page-layout
  title="Membership Type Management"
  subtitle="Define membership categories for your club"
>
  <!-- ================= Actions ================= -->
  <div actions class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
    <!-- Search -->
    <app-search-input placeholder="Search types..." (search)="onSearch($event)"></app-search-input>

    <!-- Create Button -->
    <button
      class="px-5 py-2 rounded-xl bg-primary text-white flex items-center gap-2 hover:bg-primaryHover transition"
      (click)="openCreateModal()"
    >
      <span class="text-lg">+</span>
      Create Type
    </button>
  </div>

  <!-- ================= Content ================= -->
  <div class="space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-semibold text-darkGray dark:text-white">Membership Types</h2>

      <p class="text-sm text-mediumGray">{{ filteredData.length }} types found</p>
    </div>

    <!-- Table -->
    <app-tables
      [columns]="columns"
      [data]="filteredData"
      [showActions]="true"
      (edit)="openEditModal($event)"
    ></app-tables>
  </div>
</app-page-layout>

<!-- ================= Modal ================= -->
<app-membership-type-modal
  *ngIf="isModalOpen"
  [branches]="branches"
  [data]="editItem"
  (save)="saveMembershipType($event)"
  (close)="closeModal()"
></app-membership-type-modal>
