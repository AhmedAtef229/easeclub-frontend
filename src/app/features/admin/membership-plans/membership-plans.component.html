<app-page-layout
  title="Membership Plan Management"
  subtitle="Create and manage membership plans with installment options"
>
  <!-- 🔎 Action Bar -->
  <div actions class="flex justify-between items-center mb-6">
    <!-- Filter -->
    <app-dropdown
      [options]="['All', 'Active', 'Inactive']"
      [selected]="selectedStatus"
      (valueChange)="onStatusChange($event)"
    ></app-dropdown>

    <!-- Create Button -->
    <button
      type="button"
      class="px-5 py-2 rounded-xl bg-primary text-white flex items-center gap-2"
      (click)="openCreateModal()"
    >
      <i class="fa-solid fa-plus text-sm"></i>
      Create Plan
    </button>
  </div>

  <!-- Header -->
  <div class="flex justify-between mb-3">
    <h3 class="text-lg font-semibold">Membership Plans</h3>
    <span>{{ filteredData.length }} plans found</span>
  </div>

  <!-- Table -->
  <app-tables
    [columns]="columns"
    [data]="filteredData"
    [showActions]="true"
    [showManage]="true"
    (edit)="onEdit($event)"
    (manage)="onManageTemplates($event)"
    (toggleStatus)="onToggleStatus($event)"
  ></app-tables>
</app-page-layout>

<!-- 🔥 Membership Modal (Create) -->
<app-membership-plan-modal
  *ngIf="showModal"
  [plan]="null"
  (close)="closeModal()"
  (save)="onSavePlan($event)"
></app-membership-plan-modal>

<!-- 🔥 Membership Edit Modal -->
<app-membership-plan-edit-modal
  *ngIf="showEditModal && selectedPlan"
  [plan]="selectedPlan"
  (close)="closeModal()"
  (save)="onSaveEdit($event)"
></app-membership-plan-edit-modal>

<!-- 🔥 Membership Link Modal -->
<app-membership-plan-link-modal
  *ngIf="showLinkModal && selectedPlan"
  [plan]="selectedPlan"
  (close)="closeModal()"
  (save)="onSaveLink($event)"
></app-membership-plan-link-modal>

<!-- 🔥 Installment Modal (View Only) -->
<app-installment-plan-modal
  *ngIf="showInstallmentModal"
  [plan]="selectedPlanForInstallments"
  (close)="showInstallmentModal = false"
></app-installment-plan-modal>
