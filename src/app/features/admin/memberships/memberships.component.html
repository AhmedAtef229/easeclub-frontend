<app-page-layout
  title="Membership Management"
  subtitle="View and manage club memberships"
  [hasActions]="true"
>

  <!-- HEADER FILTERS (زي التصميم) -->
  <div
    actions
    class="flex items-center gap-3 w-full"
  >

    <!-- SEARCH -->
    <div class="flex-1">
      <app-search-input
        placeholder="Search by name, membership number"
        (search)="onSearch($event)"
      ></app-search-input>
    </div>

    <!-- STATUS DROPDOWN -->
    <app-dropdown
      [options]="['All Statuses', 'Active', 'Expired', 'Cancelled']"
      [selected]="selectedStatus || 'All Statuses'"
      (valueChange)="setStatus($event)"
      class="min-w-[160px]"
    ></app-dropdown>

  </div>

  <!-- TABLE -->
  <app-card-table-wrapper
    title="Memberships"
    [count]="data.length"
    itemLabel="membership"
    class="mt-4 block"
  >
    <app-tables
      [columns]="columns"
      [data]="data"
      [borderless]="false"
      [bordered]="false"
    ></app-tables>
  </app-card-table-wrapper>

</app-page-layout>
