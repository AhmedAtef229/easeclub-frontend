<div class="flex flex-col gap-6 sm:gap-8">
  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-darkGray dark:text-white">
        {{ title }}
      </h1>

      <p class="text-sm sm:text-base text-mediumGray mt-2">
        {{ subtitle }}
      </p>
    </div>

    <div>
      <button
        *ngIf="!isEditing"
        (click)="startEdit()"
        class="bg-primary hover:bg-primaryHover text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition"
      >
        Edit Settings
      </button>

      <div *ngIf="isEditing" class="flex gap-3">
        <button
          (click)="cancelEdit()"
          class="px-5 py-2.5 rounded-xl border border-borderGray dark:border-darkBorder text-darkGray dark:text-white hover:bg-gray-100 dark:hover:bg-darkCard transition"
        >
          Cancel
        </button>

        <button
          (click)="saveEdit()"
          class="bg-primary hover:bg-primaryHover text-white px-5 py-2.5 rounded-xl font-semibold transition"
        >
          Save Changes
        </button>
      </div>
    </div>
  </div>

  <!-- Club Identity -->
  <div
    class="bg-cardGray dark:bg-darkCard border border-borderGray dark:border-darkBorder rounded-2xl p-6 space-y-6"
  >
    <h2 class="flex items-center gap-2 text-lg font-semibold text-darkGray dark:text-white">
      <!-- Branches Icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="w-5 h-5 text-primary"
      >
        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
        <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
        <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
        <path d="M10 6h4"></path>
        <path d="M10 10h4"></path>
        <path d="M10 14h4"></path>
        <path d="M10 18h4"></path>
      </svg>

      Club Identity
    </h2>

    <!-- LOGO -->
    <div class="flex justify-between items-center">
      <p class="text-sm font-semibold text-darkGray dark:text-white">Club Logo</p>

      <button
        *ngIf="isEditing"
        (click)="showLogoModal = true"
        class="text-primary border border-primary px-3 py-1.5 rounded-lg hover:bg-primary/10 transition"
      >
        Change Logo
      </button>
    </div>

<img
  [src]="(isEditing ? editData.logo : club.logo) || 'assets/images/logo_image.png'"
  class="w-24 h-24 rounded-full object-cover border"
/>

    <!-- NAME -->
    <div>
      <p class="text-sm font-semibold text-darkGray dark:text-white mb-1">Club Name</p>

      <p *ngIf="!isEditing" class="text-mediumGray">
        {{ club.name }}
      </p>

      <input
        *ngIf="isEditing"
        [(ngModel)]="editData.name"
        class="w-full p-3 rounded-xl border border-borderGray dark:border-darkBorder bg-white dark:bg-darkCard text-darkGray dark:text-white outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
      />
    </div>

    <!-- IMAGE -->
    <div class="flex justify-between items-center">
      <p class="text-sm font-semibold text-darkGray dark:text-white">Club Image</p>

      <button
        *ngIf="isEditing"
        (click)="showImageModal = true"
        class="text-primary border border-primary px-3 py-1.5 rounded-lg hover:bg-primary/10 transition"
      >
        Change Image
      </button>
    </div>

  <img
  [src]="(isEditing ? editData.cover : club.cover) || 'assets/images/club_image.png'"
  class="w-full h-56 object-cover rounded-xl border"
/>
  </div>

  <!-- About -->
  <div
    class="bg-cardGray dark:bg-darkCard border border-borderGray dark:border-darkBorder rounded-2xl p-6"
  >
    <h2 class="flex items-center gap-2 text-lg font-semibold text-darkGray dark:text-white">
      <i class="fa-regular fa-circle-question w-5 h-5 text-primary"></i>

      About
    </h2>
    <p *ngIf="!isEditing" class="text-mediumGray mt-3">
      {{ club.description }}
    </p>

    <textarea
      *ngIf="isEditing"
      [(ngModel)]="editData.description"
      class="w-full mt-3 p-3 rounded-xl border border-borderGray dark:border-darkBorder bg-white dark:bg-darkCard text-darkGray dark:text-white outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
    ></textarea>
  </div>

  <!-- Amenities -->
  <div
    class="bg-cardGray dark:bg-darkCard border border-borderGray dark:border-darkBorder rounded-2xl p-6"
  >
    <div class="flex justify-between items-center mb-3">
      <h2 class="flex items-center gap-2 text-lg font-semibold text-darkGray dark:text-white">
        <!-- check icon -->
        <svg
          class="w-5 h-5 text-primary dark:text-darkPrimary"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
          <path d="m9 11 3 3L22 4"></path>
        </svg>
        Amenities
      </h2>

      <button
        *ngIf="isEditing"
        (click)="showAmenityModal = true"
        class="text-primary font-semibold"
      >
        + Add Amenity
      </button>
    </div>

    <div class="flex flex-wrap gap-2">
      <span
        *ngFor="let item of isEditing ? editData.amenities : club.amenities"
        class="px-3 py-1 rounded-lg bg-primary/10 text-primary"
      >
        {{ item }}
      </span>
    </div>
  </div>

  <!-- Contact -->
  <!-- Contact -->
  <div
    class="bg-cardGray dark:bg-darkCard border border-borderGray dark:border-darkBorder rounded-2xl p-6"
  >
    <!-- Header -->
    <h2 class="flex items-center gap-2 text-lg font-semibold text-darkGray dark:text-white">
      <i class="fa-solid fa-phone w-5 h-5 text-primary"></i>
      Contact Information
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
      <!-- Phone -->
      <div>
        <p class="font-semibold mb-1 dark:text-white">Phone</p>

        <div *ngIf="!isEditing" class="flex items-center gap-2 text-mediumGray">
          <i class="fa-solid fa-phone text-primary"></i>
          {{ club.phone }}
        </div>

        <div *ngIf="isEditing" class="flex items-center gap-2">
          <i class="fa-solid fa-phone text-primary"></i>
          <input
            [(ngModel)]="editData.phone"
            class="w-full p-3 rounded-xl border border-borderGray dark:border-darkBorder bg-white dark:bg-darkCard text-darkGray dark:text-white outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
        </div>
      </div>

      <!-- Email -->
      <div>
        <p class="font-semibold mb-1 dark:text-white">Email</p>

        <div *ngIf="!isEditing" class="flex items-center gap-2 text-mediumGray">
          <i class="fa-regular fa-envelope text-primary"></i>
          {{ club.email }}
        </div>

        <div *ngIf="isEditing" class="flex items-center gap-2">
          <i class="fa-regular fa-envelope text-primary"></i>
          <input
            [(ngModel)]="editData.email"
            class="w-full p-3 rounded-xl border border-borderGray dark:border-darkBorder bg-white dark:bg-darkCard text-darkGray dark:text-white outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- Work Hours -->
  <div
    class="bg-cardGray dark:bg-darkCard border border-borderGray dark:border-darkBorder rounded-2xl p-6"
  >
    <h2 class="flex items-center gap-2 text-lg font-semibold text-darkGray dark:text-white">
      <svg
        class="w-5 h-5 text-primary dark:text-darkPrimary"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      Work Hours
    </h2>

    <div *ngIf="!isEditing" class="mt-3 text-mediumGray">
      <p *ngFor="let item of club.workHours">
        {{ item }}
      </p>
    </div>

    <div *ngIf="isEditing" class="mt-3">
      <input
        *ngFor="let item of editData.workHours; let i = index"
        [(ngModel)]="editData.workHours[i]"
        class="w-full mb-2 p-3 rounded-xl border border-borderGray dark:border-darkBorder bg-white dark:bg-darkCard text-darkGray dark:text-white outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
      />
    </div>
  </div>
</div>

<app-change-logo-modal
  *ngIf="showLogoModal"
  (close)="showLogoModal = false"
  (submit)="onLogoChange($event)"
></app-change-logo-modal>

<app-change-photo-modal
  *ngIf="showImageModal"
  (close)="showImageModal = false"
  (submit)="onImageChange($event)"
></app-change-photo-modal>

<app-add-amenity-modal
  *ngIf="showAmenityModal"
  (close)="showAmenityModal = false"
  (submit)="onAddAmenity($event)"
></app-add-amenity-modal>
