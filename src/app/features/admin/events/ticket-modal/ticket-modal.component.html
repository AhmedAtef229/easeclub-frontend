<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white dark:bg-darkCard w-full max-w-lg rounded-3xl shadow-2xl
              max-h-[95vh] flex flex-col overflow-hidden border border-gray-100 dark:border-darkBorder">

    <!-- Header -->
    <div class="p-6 pb-4 flex justify-between items-start">
      <div>
        <h2 class="text-2xl font-bold text-darkGray dark:text-white mb-1">
          {{ ticket ? 'Edit Ticket Type' : 'Add Ticket Type' }}
        </h2>
        <p class="text-mediumGray text-sm">Define who can attend and at what price</p>
      </div>
      <button (click)="close.emit()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-darkBorder transition-colors">
        <i class="fa-solid fa-xmark text-lg text-mediumGray"></i>
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="flex-1 overflow-y-auto p-6 pt-2">
      <form *ngIf="form" [formGroup]="form" class="space-y-5">

        <!-- Category Selector -->
        <div>
          <label class="text-sm font-semibold text-darkGray dark:text-white block mb-2">
            Category <span class="text-red-400">*</span>
          </label>
          <div class="grid grid-cols-2 gap-2">
            <button
              *ngFor="let cat of categories"
              type="button"
              (click)="setCategory(cat)"
              class="py-2.5 rounded-xl border-2 text-sm font-semibold transition-all"
              [ngClass]="form.get('category')?.value === cat
                ? 'border-primary bg-primary/5 text-primary dark:text-darkPrimary dark:border-darkPrimary'
                : 'border-gray-200 dark:border-darkBorder text-mediumGray hover:border-primary/40'"
            >
              <i class="fa-solid mr-1.5"
                 [ngClass]="{
                   'fa-id-card': cat === 'Member',
                   'fa-user': cat === 'Guest',
                   'fa-people-roof': cat === 'FamilyMember',
                   'fa-globe': cat === 'Public'
                 }"></i>
              {{ cat }}
            </button>
          </div>
        </div>

        <!-- Price + Quantity -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm font-semibold text-darkGray dark:text-white block mb-1.5">
              Base Price (EGP) <span class="text-red-400">*</span>
            </label>
            <input
              type="number"
              formControlName="basePrice"
              min="0"
              class="w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-darkCard
                     border border-gray-100 dark:border-darkBorder
                     text-darkGray dark:text-white
                     focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
            />
            <p class="text-xs text-mediumGray mt-1">Enter 0 for free tickets</p>
          </div>
          <div>
            <label class="text-sm font-semibold text-darkGray dark:text-white block mb-1.5">
              Total Quantity <span class="text-red-400">*</span>
            </label>
            <input
              type="number"
              formControlName="totalQuantity"
              min="1"
              class="w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-darkCard
                     border border-gray-100 dark:border-darkBorder
                     text-darkGray dark:text-white
                     focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
            />
          </div>
        </div>

        <!-- Max Per Member -->
        <div>
          <label class="text-sm font-semibold text-darkGray dark:text-white block mb-1.5">Max Per Member</label>
          <input
            type="number"
            formControlName="maxPerMember"
            min="1"
            placeholder="No limit"
            class="w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-darkCard
                   border border-gray-100 dark:border-darkBorder
                   text-darkGray dark:text-white
                   focus:ring-2 focus:ring-primary/20 focus:border-primary
                   outline-none transition-all placeholder:text-gray-300"
          />
        </div>

        <!-- Requires Membership Toggle -->
        <label class="flex items-center gap-3 cursor-pointer group">
          <div class="relative flex items-center">
            <input
              type="checkbox"
              formControlName="requiresMembership"
              class="w-5 h-5 rounded-lg border-2 border-gray-200 dark:border-darkBorder
                     appearance-none checked:bg-primary checked:border-primary transition-all cursor-pointer"
            />
            <i class="fa-solid fa-check absolute left-0.5 text-white text-[10px]
                      opacity-0 pointer-events-none"
               [ngClass]="{ 'opacity-100': form.get('requiresMembership')?.value }"></i>
          </div>
          <span class="text-sm font-medium text-darkGray dark:text-white group-hover:text-primary transition-colors">
            Requires active membership
          </span>
        </label>

        <!-- Age Restriction -->
        <div>
          <label class="text-sm font-semibold text-darkGray dark:text-white block mb-2">Age Restriction</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-mediumGray block mb-1">Min Age</label>
              <input
                type="number"
                formControlName="minAge"
                min="0"
                max="120"
                placeholder="No min"
                class="w-full px-3 py-2.5 rounded-xl bg-gray-50 dark:bg-darkCard
                       border border-gray-100 dark:border-darkBorder
                       text-darkGray dark:text-white text-sm
                       focus:ring-2 focus:ring-primary/20 focus:border-primary
                       outline-none transition-all placeholder:text-gray-300"
              />
            </div>
            <div>
              <label class="text-xs text-mediumGray block mb-1">Max Age</label>
              <input
                type="number"
                formControlName="maxAge"
                min="0"
                max="120"
                placeholder="No max"
                class="w-full px-3 py-2.5 rounded-xl bg-gray-50 dark:bg-darkCard
                       border border-gray-100 dark:border-darkBorder
                       text-darkGray dark:text-white text-sm
                       focus:ring-2 focus:ring-primary/20 focus:border-primary
                       outline-none transition-all placeholder:text-gray-300"
              />
            </div>
          </div>
        </div>

        <!-- Gender Restriction -->
        <div>
          <label class="text-sm font-semibold text-darkGray dark:text-white block mb-2">Gender Restriction</label>
          <div class="flex gap-2">
            <button
              *ngFor="let g of genderOptions"
              type="button"
              (click)="form.patchValue({ genderRestriction: g })"
              class="flex-1 py-2 rounded-xl border-2 text-sm font-semibold transition-all"
              [ngClass]="form.get('genderRestriction')?.value === g
                ? 'border-primary bg-primary/5 text-primary dark:text-darkPrimary dark:border-darkPrimary'
                : 'border-gray-200 dark:border-darkBorder text-mediumGray'"
            >{{ g }}</button>
          </div>
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="p-6 border-t border-gray-100 dark:border-darkBorder flex justify-end gap-3 bg-gray-50/50 dark:bg-darkCard/50">
      <button
        (click)="close.emit()"
        class="px-8 py-3 rounded-2xl font-bold text-mediumGray hover:text-darkGray transition-colors"
      >Cancel</button>
      <button
        (click)="submit()"
        class="px-10 py-3 rounded-2xl bg-primary hover:bg-primaryHover text-white font-bold
               shadow-lg shadow-primary/20 transition-all hover:scale-[1.02] active:scale-95"
      >
        {{ ticket ? 'Save Changes' : 'Add Ticket' }}
      </button>
    </div>
  </div>
</div>
