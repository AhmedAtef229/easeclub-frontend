<app-page-layout
  title="Installment Template Management"
  subtitle="Define payment installment structures for membership plans"
>


 <!-- Actions -->
<div actions class="flex items-center justify-between gap-4">

  <!-- Search -->

  <app-search-input
  placeholder="Search templates..."
  (search)="onSearch($event)"
></app-search-input>


  <!-- Button -->
  <button
    class="bg-primary text-white px-5 py-2 rounded-xl
           flex items-center gap-2 hover:opacity-90 transition"
    (click)="openCreateModal()"
  >
    <i class="fa-solid fa-plus text-sm"></i>
    Create Template
  </button>

</div>

  <!-- Table -->
  <app-tables
    [columns]="columns"
    [data]="filteredData"
    [showActions]="true"
    (remove)="onDelete($event)"
  ></app-tables>

</app-page-layout>

<!-- Create Installment Template Modal -->
<app-installment-template-modal
  *ngIf="showCreateModal"
  (close)="closeModal()"
  (save)="onSaveTemplate($event)"
>
</app-installment-template-modal>
