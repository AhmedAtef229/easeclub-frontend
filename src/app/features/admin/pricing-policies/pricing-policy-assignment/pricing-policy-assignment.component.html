<div
  class="bg-cardGray dark:bg-darkCard
         border border-borderGray dark:border-darkBorder
         rounded-2xl p-6"
>

  <h2 class="text-xl font-semibold text-darkGray dark:text-white mb-1">
    Pricing Policy Assignments
  </h2>

  <p class="text-mediumGray mb-6">
    Assign pricing policies to application templates or events with custom priorities
  </p>

  <!-- Select Target -->
  <div
    class="bg-white dark:bg-darkBg
           border border-borderGray dark:border-darkBorder
           rounded-xl p-6"
  >

    <h3 class="font-semibold text-darkGray dark:text-white mb-1">
      Select Target
    </h3>

    <p class="text-mediumGray text-sm mb-6">
      Choose the target type and specific target to manage policy assignments
    </p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Target Type -->
      <div>
        <label class="block text-sm font-medium mb-2 text-darkGray dark:text-white">
          Target Type *
        </label>

        <select
          class="w-full border border-borderGray dark:border-darkBorder
                 bg-white dark:bg-darkCard
                 text-darkGray dark:text-white
                 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
          (change)="onTargetTypeChange($any($event.target).value)"
        >
          <option value="">Select target type</option>

          <option *ngFor="let t of targetTypes" [value]="t.value">
            {{ t.label }}
          </option>
        </select>
      </div>

      <!-- Target -->
      <div>
        <label class="block text-sm font-medium mb-2 text-darkGray dark:text-white">
          Target *
        </label>

        <select
          class="w-full border border-borderGray dark:border-darkBorder
                 bg-white dark:bg-darkCard
                 text-darkGray dark:text-white
                 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
          (change)="onTargetChange($any($event.target).value)"
        >
          <option value="">Select target</option>

          <option *ngFor="let t of targets" [value]="t.id">
            {{ t.name }}
          </option>
        </select>
      </div>

    </div>

  </div>

</div>
