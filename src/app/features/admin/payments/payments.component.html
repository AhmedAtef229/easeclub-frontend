<!-- payments.component.html -->

<app-page-layout
  title="Finance Hub"
  subtitle="Manage membership installments, invoices, and payment tracking"
  [hasActions]="true"
>

  <!-- ================= STATS ================= -->

  <div actions class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">

    <div
      *ngFor="let stat of stats"
      class="bg-cardGray dark:bg-darkCard
             border border-borderGray dark:border-darkBorder
             rounded-2xl p-5
             flex items-center justify-between"
    >
      <div>
        <p class="text-sm text-mediumGray">
          {{ stat.title }}
        </p>

        <h3 class="text-4xl font-semibold mt-2 text-darkGray dark:text-white">
          {{ stat.value }}
        </h3>

        <p class="text-sm text-mediumGray mt-2">
          {{ stat.subtitle }}
        </p>
      </div>

      <div
        class="w-14 h-14 rounded-2xl
               flex items-center justify-center"
        [ngClass]="stat.iconBg"
      >
        <i
          class="fa-solid text-2xl"
          [ngClass]="[stat.icon, stat.iconColor]"
        ></i>
      </div>
    </div>

  </div>

  <!-- ================= TABS ================= -->

  <div
    class="flex items-center gap-6 mt-8
           border-b border-borderGray dark:border-darkBorder"
  >

    <button
      (click)="switchTab('installments')"
      class="pb-3 text-sm font-semibold border-b-2 transition-all duration-200"
      [ngClass]="
        activeTab === 'installments'
          ? 'border-primary text-primary dark:border-darkPrimary dark:text-darkPrimary'
          : 'border-transparent text-mediumGray hover:text-darkGray dark:hover:text-white'
      "
    >
      Installments
    </button>

    <button
      (click)="switchTab('invoices')"
      class="pb-3 text-sm font-semibold border-b-2 transition-all duration-200"
      [ngClass]="
        activeTab === 'invoices'
          ? 'border-primary text-primary dark:border-darkPrimary dark:text-darkPrimary'
          : 'border-transparent text-mediumGray hover:text-darkGray dark:hover:text-white'
      "
    >
      Invoices (Finance Ledger)
    </button>

  </div>

  <!-- ================= FILTERS (SEARCH & STATUS) ================= -->

  <div class="mt-6 grid grid-cols-1 lg:grid-cols-4 gap-4 items-end">

    <!-- Search -->

    <div class="lg:col-span-3">

      <label
        class="block mb-2 text-xs font-bold uppercase tracking-wider text-mediumGray"
      >
        Search
      </label>

      <app-search-input
        [placeholder]="searchPlaceholder"
        (search)="onSearch($event)"
      ></app-search-input>

    </div>

    <!-- Status Dropdown -->

    <div>

      <label
        class="block mb-2 text-xs font-bold uppercase tracking-wider text-mediumGray"
      >
        Status Filter
      </label>

      <app-dropdown
        [options]="statusOptions"
        [selected]="selectedStatus"
        (valueChange)="onStatusChange($event)"
      ></app-dropdown>

    </div>

  </div>

  <!-- ================= TABLE ================= -->

  <div class="mt-6">

    <app-tables
      [columns]="columns"
      [data]="filteredPayments"
      [showActions]="false"
      [serverSide]="true"
      [totalCount]="totalCount"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      (pageChange)="onPageChange($event)"
    ></app-tables>

  </div>

  <!-- ================= EMPTY STATE ================= -->

  <div
    *ngIf="filteredPayments?.length === 0"
    class="text-center py-16 text-gray-400 font-medium"
  >
    <span class="block text-2xl mb-2">🔍</span>
    No records found matching your filters
  </div>

</app-page-layout>
