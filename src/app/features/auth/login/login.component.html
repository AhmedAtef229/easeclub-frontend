<app-auth-layout>
  <form
    [formGroup]="loginForm"
    (ngSubmit)="login()"
    class="space-y-5"
  >
    <h2
      class="text-2xl font-semibold text-center
             text-darkGray dark:text-white"
    >
      Admin Login
    </h2>

    <p class="text-center text-sm text-mediumGray">
      Please sign in to access the management panel.
    </p>

    <div *ngIf="error" class="text-sm text-center text-danger">
      {{ error }}
    </div>

    <!-- Email -->
    <input
      type="email"
      formControlName="email"
      placeholder="admin@easeclub.com"
      class="w-full px-4 py-3 rounded-lg
             bg-white dark:bg-darkCard
             border border-[#E0E0E0] dark:border-darkBorder
             text-darkGray dark:text-white
             focus:outline-none focus:ring-2 focus:ring-lavender"
    />

    <!-- Password -->
    <input
      type="password"
      formControlName="password"
      placeholder="••••••••"
      class="w-full px-4 py-3 rounded-lg
             bg-white dark:bg-darkCard
             border border-[#E0E0E0] dark:border-darkBorder
             text-darkGray dark:text-white
             focus:outline-none focus:ring-2 focus:ring-lavender"
    />

    <!-- Button -->
    <button
      type="submit"
      [disabled]="loading"
      class="w-full py-3 rounded-lg font-medium
             bg-primary hover:bg-primaryHover
             text-white transition disabled:opacity-60"
    >
      {{ loading ? 'Signing in...' : 'Sign In →' }}
    </button>
  </form>
</app-auth-layout>
