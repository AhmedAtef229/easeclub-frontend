<app-auth-layout>
  <div icon>
    <i class="fa-solid fa-lock text-primary text-xl"></i>
  </div>
  <form *ngIf="form" [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
    <h2 class="text-2xl font-semibold text-center text-gray-900 dark:text-white">
      {{ 'AUTH.RESET.TITLE' | translate }}
    </h2>

    <p class="text-center text-sm text-gray-500 dark:text-gray-400">
      {{ 'AUTH.RESET.DESC' | translate }}
    </p>

    <div *ngIf="error" class="text-center text-red-500 text-sm">
      {{ error }}
    </div>

    <div class="relative">
      <i
        class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
      ></i>

      <input
        type="password"
        formControlName="password"
        [placeholder]="'AUTH.RESET.NEW_PASSWORD' | translate"
        class="w-full px-4 py-3 pl-11 rounded-lg bg-white dark:bg-darkCard border border-[#E0E0E0] dark:border-darkBorder text-darkGray dark:text-white placeholder-mediumGray dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-lavender"
      />
    </div>

    <div class="relative">
      <i
        class="fa-solid fa-circle-check absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
      ></i>

      <input
        type="password"
        formControlName="confirmPassword"
        [placeholder]="'AUTH.RESET.CONFIRM_PASSWORD' | translate"
        class="w-full px-4 py-3 pl-11 rounded-lg bg-white dark:bg-darkCard border border-[#E0E0E0] dark:border-darkBorder text-darkGray dark:text-white placeholder-mediumGray dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-lavender"
      />
    </div>

    <button
      type="submit"
      [disabled]="loading"
      class="w-full h-12 bg-[#6A0DAD] hover:bg-[#5a0ba0] text-white font-medium rounded-lg transition flex items-center justify-center gap-2 disabled:opacity-50"
    >
      {{ loading ? ('AUTH.RESET.SAVING' | translate) : ('AUTH.RESET.BUTTON' | translate) }}
      <span *ngIf="!loading">→</span>
    </button>
  </form>
</app-auth-layout>

<!-- Success Dialog Overlay -->
<div *ngIf="showSuccessModal" class="fixed inset-0 bg-black/45 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-darkCard w-full max-w-sm rounded-2xl shadow-xl border border-gray-200 dark:border-darkBorder p-6 space-y-6 text-center transform scale-100 transition-all">
    <!-- Success Icon -->
    <div class="mx-auto w-16 h-16 rounded-full bg-emerald-50 dark:bg-emerald-950/30 flex items-center justify-center">
      <i class="fa-solid fa-circle-check text-emerald-500 text-3xl"></i>
    </div>
    
    <!-- Title & Desc -->
    <div class="space-y-2">
      <h3 class="text-xl font-bold text-darkGray dark:text-white">
        Password Reset Successfully!
      </h3>
      <p class="text-sm text-mediumGray">
        Your password has been successfully updated. You can now login to your account with your new password.
      </p>
    </div>

    <!-- Go to Login Button -->
    <button
      (click)="goToLogin()"
      class="w-full py-3 bg-primary hover:bg-primaryHover text-white font-semibold rounded-xl transition duration-200 shadow-md shadow-primary/20"
    >
      Go to Login
    </button>
  </div>
</div>
