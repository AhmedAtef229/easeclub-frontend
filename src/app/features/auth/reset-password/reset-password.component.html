<app-auth-layout>
  <form class="space-y-5">
    <h2 class="text-2xl font-semibold text-center text-darkGray dark:text-white">Reset Password</h2>

    <p class="text-center text-sm text-mediumGray">Enter your email to reset your password</p>

    <input
      type="email"
      placeholder="admin@easeclub.com"
      class="w-full px-4 py-3 rounded-lg bg-white dark:bg-darkCard border border-[#E0E0E0] dark:border-darkBorder"
    />

    <button class="w-full py-3 rounded-lg font-medium bg-lavender text-darkGray">
      Send Reset Link
    </button>
  </form>
</app-auth-layout>
