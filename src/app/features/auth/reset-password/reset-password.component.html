<app-auth-layout>
  <!-- ICON SLOT -->
  <div icon>
    <i class="fa-solid fa-lock text-primary text-xl"></i>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
    <h2 class="text-2xl font-semibold text-center text-gray-900 dark:text-white">Reset Password</h2>

    <p class="text-center text-sm text-gray-500 dark:text-gray-400">
      Please enter your new password to secure your account
    </p>

    <div *ngIf="error" class="text-center text-red-500 text-sm">
      {{ error }}
    </div>

    <!-- <input
      type="password"
      formControlName="password"
      placeholder="New Password"
      class="w-full rounded-lg px-4 py-3 bg-gray-50 text-gray-900 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary dark:bg-[#1B1433] dark:text-white dark:border-[#2A2150] dark:placeholder-gray-400"
    /> -->
    <div class="relative">
      <i
        class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
      ></i>

      <input
        type="password"
        formControlName="password"
        placeholder="New Password"
        class="w-full rounded-lg px-4 py-3 pl-11 bg-gray-50 text-gray-900 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary dark:bg-[#1B1433] dark:text-white dark:border-[#2A2150] dark:placeholder-gray-400"
      />
    </div>

 <div class="relative">
  <i
    class="fa-solid fa-circle-check
           absolute left-3 top-1/2 -translate-y-1/2
           text-gray-400
           pointer-events-none"
  ></i>

  <input
    type="password"
    formControlName="confirmPassword"
    placeholder="Confirm Password"
    class="w-full rounded-lg px-4 py-3 pl-11
           bg-gray-50 text-gray-900
           border border-gray-300
           focus:outline-none focus:ring-2 focus:ring-primary
           dark:bg-[#1B1433] dark:text-white
           dark:border-[#2A2150]
           dark:placeholder-gray-400"
  />
</div>


    <button
      type="submit"
      [disabled]="loading"
      class="w-full h-12 bg-[#6A0DAD] hover:bg-[#5a0ba0] text-white font-medium rounded-lg transition flex items-center justify-center gap-2 disabled:opacity-50"
    >
      Reset Password

      <span *ngIf="loading">Saving...</span>
      <span *ngIf="!loading">→</span>
    </button>
  </form>
</app-auth-layout>
